[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vibonomics"
version = "0.1.0"
description = "Self-hosted LLM model, price and performance analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "apscheduler>=3.10,<4",
  "cryptography>=42",
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
vibonomics = "vibonomics.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["vibonomics"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vibonomics/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# ASYNC109: our timeout params are passed straight to httpx. ASYNC240: cache files are tiny.
ignore = ["RUF001", "RUF012", "B008", "ASYNC109", "ASYNC240", "SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
