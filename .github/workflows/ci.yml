name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check vibonomics tests
      - name: Format check
        run: ruff format --check vibonomics tests
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: vibonomics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sandbox healthcheck
        run: |
          docker run -d --name sandbox-health --user 65534:65534 --read-only \
            --tmpfs /tmp:size=64m -p 2290:2290 vibonomics:ci \
            python -m vibonomics sandbox
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:2290/health; then break; fi
            sleep 2
          done
          docker rm -f sandbox-health
