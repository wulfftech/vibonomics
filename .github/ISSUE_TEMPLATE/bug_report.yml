name: Bug report
description: Something in Vibonomics is broken or gives wrong data.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys and tokens from anything you paste. If you cannot, describe the shape of the
        error instead. Security issues belong in the private channel described in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Vibonomics version
      description: From Settings → General, or `GET /api/system/status`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    label: How is it deployed?
    options:
      - docker compose (bundled sandbox sidecar)
      - Docker, app container only
      - Bare Python (`python -m vibonomics`)
      - Something else
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host platform
      placeholder: "Ubuntu 24.04 / Docker 29.8, or Windows 11 / Python 3.12"
  - type: dropdown
    id: area
    label: Where does it happen?
    multiple: true
    options:
      - Models table or prices
      - Discounts or highlights
      - Balances or key spend
      - Claude subscription usage
      - Scores or benchmark sources
      - Unmatched models
      - Test runs or the sandbox
      - Config snippets
      - Settings or providers
      - Refresh jobs
      - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an OpenRouter key under Settings → Providers
        2. Press Test, then Save
        3. Refresh models, then filter by Discounted
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        `docker compose logs vibonomics --tail 200`, or the refresh message shown in Settings → Providers.
        Keys must not appear here.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed keys, tokens and personal paths from the text above.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I checked the open issues for the same problem.
          required: true
