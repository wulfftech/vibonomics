name: vibonomics

services:
  vibonomics:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vibonomics:local
    container_name: vibonomics
    ports:
      - "${VIBONOMICS_PORT:-2289}:2289"
    volumes:
      - "${VIBONOMICS_CONFIG:-./config}:/config"
      # The sandbox's socket: with no network, this is the only way in or out of the sandbox.
      - sandbox-socket:/run/vibonomics-sandbox:ro
    # Everything in .env reaches the app (provider keys, password, secret key), so keys can be
    # supplied by environment instead of the Settings page. The file is optional.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: "${TZ:-Etc/UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-002}"
      # Repeated here so they also work when exported in the shell without a .env file.
      VIBONOMICS_PASSWORD: "${VIBONOMICS_PASSWORD:-}"
      VIBONOMICS_SECRET_KEY: "${VIBONOMICS_SECRET_KEY:-}"
      VIBONOMICS_URL_BASE: "${VIBONOMICS_URL_BASE:-}"
      VIBONOMICS_LOG_LEVEL: "${VIBONOMICS_LOG_LEVEL:-info}"
      VIBONOMICS_SANDBOX_URL: "unix:///run/vibonomics-sandbox/sandbox.sock"
      VIBONOMICS_SANDBOX_TOKEN: "${VIBONOMICS_SANDBOX_TOKEN:-}"
      # Refuse every request that arrives from the sandbox's network. Only the TCP layout
      # (docker/compose.sandbox-tcp.yml) has one; set it to "off" to allow such requests.
      VIBONOMICS_SANDBOX_GUARD: "${VIBONOMICS_SANDBOX_GUARD:-on}"
    depends_on:
      - sandbox
    restart: unless-stopped

  # Executes model-written code during tests. Isolated: no network at all (the app reaches it through
  # a Unix socket on a shared in-memory volume), no secrets, no /config, read-only filesystem,
  # non-root, capped CPU/memory/processes. To use TCP on an internal network instead, add
  # docker/compose.sandbox-tcp.yml (see .env.example).
  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vibonomics:local
    container_name: vibonomics-sandbox
    command: ["python", "-m", "vibonomics", "sandbox"]
    # An init as PID 1 reaps processes a test orphans; without it they stay as zombies under the
    # server and count against pids_limit until the container restarts.
    init: true
    environment:
      VIBONOMICS_SANDBOX_SOCKET: /run/vibonomics-sandbox/sandbox.sock
      VIBONOMICS_SANDBOX_TOKEN: "${VIBONOMICS_SANDBOX_TOKEN:-}"
    volumes:
      - sandbox-socket:/run/vibonomics-sandbox
    network_mode: none
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-m", "vibonomics", "sandbox", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  # In memory, and writable only by the sandbox's user, which creates the socket in it.
  sandbox-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=65534,gid=65534,mode=0755"
