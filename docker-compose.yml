name: vibonomics

services:
  vibonomics:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vibonomics:local
    container_name: vibonomics
    ports:
      - "${VIBONOMICS_PORT:-2289}:2289"
    volumes:
      - "${VIBONOMICS_CONFIG:-./config}:/config"
      # The sandbox's socket: with no network, this is the only way in or out of the sandbox.
      - sandbox-socket:/run/vibonomics-sandbox:ro
    # Everything in .env reaches the app (provider keys, password, secret key), so keys can be
    # supplied by environment instead of the Settings page. The file is optional.
    env_file:
      - path: .env
        required: false
    # Local sandbox mode runs tests as children of this container. An init as PID 1 reaps the ones they
    # orphan, and pids_limit caps how many they can start. The cap counts threads too, so it is far
    # looser than the sidecar's.
    init: true
    pids_limit: 1024
    environment:
      # .env reaches the container through env_file, and VIBONOMICS_PORT there is the host port. Left to
      # that, the app would listen on it too, and the port mapping and healthcheck both expect 2289.
      VIBONOMICS_PORT: "2289"
      TZ: "${TZ:-Etc/UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-002}"
      # Repeated here so they also work when exported in the shell without a .env file.
      VIBONOMICS_PASSWORD: "${VIBONOMICS_PASSWORD:-}"
      VIBONOMICS_OPEN_READ: "${VIBONOMICS_OPEN_READ:-}"
      VIBONOMICS_SECRET_KEY: "${VIBONOMICS_SECRET_KEY:-}"
      VIBONOMICS_URL_BASE: "${VIBONOMICS_URL_BASE:-}"
      VIBONOMICS_ALLOWED_HOSTS: "${VIBONOMICS_ALLOWED_HOSTS:-}"
      VIBONOMICS_LOG_LEVEL: "${VIBONOMICS_LOG_LEVEL:-info}"
      VIBONOMICS_SANDBOX_URL: "unix:///run/vibonomics-sandbox/sandbox.sock"
      VIBONOMICS_SANDBOX_TOKEN: "${VIBONOMICS_SANDBOX_TOKEN:-}"
      # Refuse every request that arrives from the sandbox's network. Only the TCP layout
      # (docker/compose.sandbox-tcp.yml) has one; set it to "off" to allow such requests.
      VIBONOMICS_SANDBOX_GUARD: "${VIBONOMICS_SANDBOX_GUARD:-on}"
    depends_on:
      - sandbox
    restart: unless-stopped

  # Executes model-written code during tests. Isolated: no network at all (the app reaches it through
  # a Unix socket on a shared in-memory volume), no secrets, no /config, read-only filesystem, capped
  # CPU/memory/processes. To use TCP on an internal network instead, add docker/compose.sandbox-tcp.yml
  # (see .env.example).
  #
  # The server runs as root with three capabilities, so it can start every run under one of the two
  # unprivileged uids in VIBONOMICS_SANDBOX_RUN_UIDS, own that run's files as the uid, and kill and clean up
  # by uid. Code under test never runs as root, and cannot touch the server, the socket (the volume below is
  # root's) or another run's files. When all runs shared the server's uid, a process that started its own
  # session survived its run and could rewrite later runs' workspaces, hidden tests included.
  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vibonomics:local
    container_name: vibonomics-sandbox
    # Not the image's entrypoint: that drops root to PUID and wants /config, neither of which applies here.
    entrypoint: ["python", "-m", "vibonomics", "sandbox"]
    # An init as PID 1 reaps processes a test orphans; without it they stay as zombies under the
    # server and count against pids_limit until the container restarts.
    init: true
    environment:
      VIBONOMICS_SANDBOX_SOCKET: /run/vibonomics-sandbox/sandbox.sock
      VIBONOMICS_SANDBOX_TOKEN: "${VIBONOMICS_SANDBOX_TOKEN:-}"
      # One uid per concurrent run (the server allows two at once).
      VIBONOMICS_SANDBOX_RUN_UIDS: "65530,65531"
    volumes:
      - sandbox-socket:/run/vibonomics-sandbox
    network_mode: none
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-m", "vibonomics", "sandbox", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  # In memory, and writable only by root: the sandbox server creates the socket in it, and the uids code
  # under test runs as cannot remove or replace it.
  sandbox-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=0,mode=0755"
